<div class="login-wrapper d-flex align-items-center justify-content-center">
  <!-- Language Toggle on Login -->
  <div class="login-lang-toggle">
    <button class="btn lang-toggle-btn" (click)="lang.toggle()">
      <i class="bi bi-translate me-1"></i>
      <span>{{ lang.t('lang_name') }}</span>
      <span class="lang-sep">|</span>
      <span>{{ lang.t('lang_toggle') }}</span>
    </button>
  </div>

  <div class="login-card card border-0">
    <div class="card-body p-4 p-md-5">
      <!-- App Icon & Title -->
      <div class="text-center mb-4">
        <div class="app-icon-wrapper mb-3">
          <i class="bi bi-house-door-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">{{ lang.t('login_title') }}</h3>
        <p class="text-muted small">{{ lang.t('login_subtitle') }}</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show py-2 d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span>{{ errorMessage }}</span>
        <button type="button" class="btn-close btn-close-sm" (click)="errorMessage = ''"></button>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold small text-muted">{{ lang.t('login_username') }}</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input
              type="text"
              class="form-control border-start-0 ps-0"
              id="username"
              [placeholder]="lang.t('login_ph_username')"
              [(ngModel)]="username"
              name="username"
              required
              [disabled]="isLoading"
            />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold small text-muted">{{ lang.t('login_password') }}</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input
              type="password"
              class="form-control border-start-0 ps-0"
              id="password"
              [placeholder]="lang.t('login_ph_password')"
              [(ngModel)]="password"
              name="password"
              required
              [disabled]="isLoading"
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 fw-semibold"
          [disabled]="isLoading || !username || !password"
        >
          <span *ngIf="!isLoading">
            <i class="bi bi-box-arrow-in-right me-2"></i>{{ lang.t('login_btn') }}
          </span>
          <span *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            {{ lang.t('login_loading') }}
          </span>
        </button>
      </form>

      <!-- Hint -->
      <div class="text-center mt-4">
        <p class="hint-text mb-0">
          <i class="bi bi-info-circle me-1"></i>
          Use <strong>admin</strong> / <strong>admin123</strong>
        </p>
      </div>
    </div>
  </div>
</div>
