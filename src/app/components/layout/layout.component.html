<div class="layout-container" [class.sidebar-open]="sidebarOpen">
  <!-- Sidebar Backdrop (tablet & mobile) -->
  <div
    class="sidebar-backdrop"
    [class.d-none]="!sidebarOpen"
    *ngIf="sidebarOpen"
    (click)="onBackdropClick()"
  ></div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <div class="d-flex align-items-center">
        <div class="sidebar-logo-icon me-3 shadow-lg">
          <i class="bi bi-buildings-fill"></i>
        </div>
        <div>
          <h5 class="mb-0 fw-bolder text-white" style="letter-spacing: 0.5px;">Family Rent</h5>
          <small class="text-white-50 fw-semibold" style="font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;">Manager</small>
        </div>
      </div>
      <button class="btn btn-link text-white-50 p-0 sidebar-close-btn" (click)="toggleSidebar()" aria-label="Close sidebar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <ul class="nav flex-column">
        <li class="nav-item" *ngFor="let item of navItems">
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="onBackdropClick()"
          >
            <i class="bi {{ item.icon }} nav-icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="d-flex align-items-center">
        <div class="user-avatar-sm me-2">{{ userInitial }}</div>
        <div>
          <small class="text-white fw-semibold d-block" style="font-size: 0.8rem;">{{ userName }}</small>
          <small class="text-white-50" style="font-size: 0.7rem;">{{ lang.t('nav_administrator') }}</small>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Top Header -->
    <header class="top-header">
      <div class="d-flex align-items-center justify-content-between w-100">
        <!-- Left: Hamburger -->
        <div class="d-flex align-items-center">
          <button class="btn btn-link text-dark p-0 me-3 hamburger-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
            <i class="bi bi-list fs-4"></i>
          </button>
          <h5 class="mb-0 fw-semibold text-dark d-none d-md-block">Family Rent Manager</h5>
          <div class="ms-4 d-none d-lg-flex align-items-center text-muted fw-medium" style="font-size: 0.9rem;">
            <i class="bi bi-clock me-2 text-primary"></i>
            {{ currentDate | date:'medium' }}
          </div>
        </div>

        <!-- Right: Language Toggle + User Dropdown -->
        <div class="d-flex align-items-center gap-3">
          <!-- Language Toggle Button -->
          <button
            id="lang-toggle-btn"
            class="btn lang-toggle-btn"
            (click)="toggleLanguage()"
            [title]="'Switch to ' + lang.t('lang_toggle')"
          >
            <i class="bi bi-translate me-1"></i>
            <span class="lang-current">{{ lang.t('lang_name') }}</span>
            <span class="lang-sep">|</span>
            <span class="lang-other">{{ lang.t('lang_toggle') }}</span>
          </button>

          <!-- Theme Toggle Button -->
          <button
            class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center p-0"
            style="width: 36px; height: 36px; transition: all 0.3s ease;"
            (click)="toggleTheme()"
            [title]="currentTheme === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode'"
          >
            <i class="bi fs-5" [ngClass]="currentTheme === 'light' ? 'bi-moon-fill text-dark' : 'bi-sun-fill text-warning'"></i>
          </button>

          <!-- User Dropdown -->
          <div class="position-relative">
            <button
              class="btn user-dropdown-btn d-flex align-items-center"
              (click)="toggleUserDropdown()"
            >
              <div class="user-avatar me-2">{{ userInitial }}</div>
              <span class="d-none d-md-inline fw-medium text-dark">{{ userName }}</span>
              <i class="bi bi-chevron-down ms-2 small text-muted"></i>
            </button>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu-custom" *ngIf="userDropdownOpen">
              <div class="dropdown-header-custom px-3 py-2">
                <strong class="d-block">{{ userName }}</strong>
                <small class="text-muted">{{ lang.t('nav_administrator') }}</small>
              </div>
              <hr class="my-1">
              <button class="dropdown-item-custom" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>{{ lang.t('nav_sign_out') }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
