<div class="container-fluid py-4">
  <!-- Page Header -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="page-title mb-0">
      <i class="bi bi-p-circle me-2"></i>Parking Details
    </h2>
  </div>

  <!-- Parking Details Table -->
  <div class="card shadow-sm">
    <div class="card-header bg-white border-bottom">
      <h5 class="card-header-title mb-0 text-primary">
        <i class="bi bi-card-list"></i> Parking List
      </h5>
    </div>
    
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-pro align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Parking No.</th>
              <th scope="col">Status</th>
              <th scope="col">Flat No.</th>
              <th scope="col">Renter Name</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of parking; let i = index">
              <td class="text-muted fw-semibold">{{ i + 1 }}</td>
              <td class="fw-bold">{{ p.parkingNumber }}</td>
              <td>
                <span class="badge" [ngClass]="p.isOccupied ? 'bg-success' : 'bg-secondary'">
                  {{ p.isOccupied ? 'Occupied' : 'Vacant' }}
                </span>
              </td>
              <td>
                <span *ngIf="p.flatNo" class="info-pill info-pill-primary">{{ p.flatNo }}</span>
                <span *ngIf="!p.flatNo" class="text-muted">-</span>
              </td>
              <td>
                <span *ngIf="p.renterName" class="fw-semibold">{{ p.renterName }}</span>
                <span *ngIf="!p.renterName" class="text-muted fst-italic">N/A</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- Empty State -->
      <div class="text-center p-5" *ngIf="parking.length === 0">
        <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
        <h5 class="text-muted">No parking details found</h5>
      </div>
    </div>
  </div>
</div>
